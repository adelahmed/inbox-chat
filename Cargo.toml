[package]
name = "inbox-chat"
version = "0.2.0"
edition = "2021"
description = "Outlook-style desktop client with an LLM assistant. Reads classic Outlook; saves drafts, never sends."
license = "MIT"
authors = ["Adel F. Ahmed <adel.f.ahmed@gmail.com>"]
repository = "https://github.com/adelahmed/inbox-chat"
homepage = "https://www.adelahmed.com"
default-run = "inbox-chat"
publish = false

[lib]
name = "inbox_chat"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: always serve the embedded ui/ folder (there is no dev server).
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
base64 = "0.23"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
