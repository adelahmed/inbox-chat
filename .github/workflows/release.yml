# Builds InboxChat.exe and attaches it to a GitHub Release.
# Push a tag that matches the version in Cargo.toml, e.g.:  git tag v0.2.0 && git push origin v0.2.0
# Run by hand (Actions → Release → Run workflow) to get the .exe as a build artifact without a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $v" }

      - name: Unit tests
        run: cargo test --lib --locked

      - name: Build
        run: cargo build --release --locked --bin inbox-chat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/inbox-chat.exe dist/InboxChat.exe
          $hash = (Get-FileHash dist/InboxChat.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  InboxChat.exe" | Out-File -Encoding ascii dist/InboxChat.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: InboxChat
          path: dist/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/InboxChat.exe
            dist/InboxChat.exe.sha256
          generate_release_notes: true